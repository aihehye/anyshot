name: Release

# Pushing a tag vX.Y.Z (matching package.json) builds the installers and publishes
# a release. Running it by hand builds the same files into a draft release to check first.
on:
  push:
    tags: ['v*']
    branches: ['ci/release-dry-run']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # Native modules ship prebuilt per CPU: install both the x64 and the ARM64 one.
      - run: bun install --frozen-lockfile --cpu="*"
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Package the x64 and ARM64 installers
        run: |
          bunx electron-builder --win nsis --x64 --publish never
          bunx electron-builder --win nsis --arm64 --publish never
      - name: Check each build carries its own screenshot module
        shell: bash
        run: |
          set -euo pipefail
          modules() { find "$1" -name 'node-screenshots.*.node' | sed 's#.*/##'; }
          modules dist/win-unpacked | grep -qx 'node-screenshots.win32-x64-msvc.node'
          modules dist/win-arm64-unpacked | grep -qx 'node-screenshots.win32-arm64-msvc.node'
          ls -l dist/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Package the .deb and the AppImage
        run: bunx electron-builder --linux deb AppImage --x64 --publish never
      - name: Check the build carries the screenshot module
        run: |
          find dist/linux-unpacked -name 'node-screenshots.linux-x64-gnu.node' | grep -q .
          ls -l dist/*.deb dist/*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

  release:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(jq -r .version package.json)
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
              exit 1
            fi
            draft=false
          else
            draft=true
          fi
          ls -l artifacts
          test "$(ls artifacts | wc -l)" -eq 4
          {
            sed "s/{{version}}/$version/g" .github/release-notes.md
            echo
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" --jq .body
          } > notes.md
          existing=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$existing" = none ]; then
            gh release create "$tag" artifacts/* --title "anyshot $version" \
              --notes-file notes.md --target "$GITHUB_SHA" --draft="$draft"
          elif [ "$existing" = true ]; then
            # A draft from a manual run: refresh its files and notes, and publish on a tag.
            gh release upload "$tag" artifacts/* --clobber
            gh release edit "$tag" --title "anyshot $version" --notes-file notes.md \
              --target "$GITHUB_SHA" --draft="$draft"
          else
            echo "::error::$tag is already published; bump the version in package.json"
            exit 1
          fi
          gh release view "$tag" --json url,isDraft,assets --jq '{url, isDraft, assets: [.assets[].name]}'
